# Milestone 6, Stages C + D: object placer (buildings, then green spaces), conditioned on roads.
[model]
width = 32           # U-Net base channels
hidden = 256

[train]
step_fraction = 0.1  # share of each tile's construction steps used per epoch (fresh order + symmetry every epoch)
chunk_tiles = 24
batch_size = 48
lr = 5e-4
lr_min = 2e-5
max_epochs = 30
patience = 6
seeds = [0, 1]
